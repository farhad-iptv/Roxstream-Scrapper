name: Roxie Streams Scraper

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── Use python -m pip instead of bare pip ─────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          python -m pip install beautifulsoup4
          python -m pip install playwright
          python -m pip install lxml

      # ── Install Playwright browsers ───────────────────────────────────
      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      # ── Confirm everything installed correctly ────────────────────────
      - name: Verify installs
        run: |
          python -m pip list
          python -c "import requests; print('requests OK')"
          python -c "import bs4; print('beautifulsoup4 OK')"
          python -c "import playwright; print('playwright OK')"

      # ── Run the scraper ───────────────────────────────────────────────
      - name: Run scraper
        run: |
          python main.py

      # ── Commit and push output files ──────────────────────────────────
      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "GitHub Action"
          git add Roxiestreams.m3u
          git add Roxiestreams_schedule.json
          git diff --staged --quiet || git commit -m "Update streams - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
