name: Roxie Streams Scraper

on:
  # Run automatically every 4 hours
  schedule:
    - cron: '0 */4 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      # ── 1. Checkout repo ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install Python dependencies ─────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Install Playwright + Chromium ───────────────────────────────
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      # ── 5. Run the scraper ─────────────────────────────────────────────
      - name: Run scraper
        run: |
          python main.py

      # ── 6. Commit and push output files ────────────────────────────────
      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "GitHub Action"

          git add Roxiestreams.m3u
          git add Roxiestreams_schedule.json

          # Only commit if something actually changed
          git diff --staged --quiet || git commit -m "Update streams - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
